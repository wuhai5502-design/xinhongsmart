<!-- ============================================================
  全站公共结构化数据：Organization
  部署位置：每个页面 </head> 之前（或公共 head 模板里加一次）
  作用：
    1. 让 Google 把 xinhongsmart.com 与公司实体绑定
    2. sameAs 把企查查 / xinhong.site / 领英 关联进来，
       形成"同一实体的多个触点"而不是"两个无关网站"
  ============================================================ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "https://xinhongsmart.com/#organization",
  "name": "Shenzhen Xinhong Smart Technology Co., Ltd.",
  "legalName": "深圳市歆鸿智慧科技有限公司",
  "alternateName": ["Xinhong Smart", "歆鸿智慧"],
  "url": "https://xinhongsmart.com/",
  "logo": "https://xinhongsmart.com/images/logo-512.png",
  "description": "China-based manufacturer of rugged industrial tablets, handheld PDA terminals, document camera scanners, signature pads and dual-screen ID verification terminals. OEM/ODM services for global B2B buyers.",
  "foundingDate": "2016",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Room 515-A089, Rongchao Economic & Trade Center, No.4028 Jintian Road, Futian District",
    "addressLocality": "Shenzhen",
    "addressRegion": "Guangdong",
    "postalCode": "518000",
    "addressCountry": "CN"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "sales",
    "telephone": "+86-185-9427-9314",
    "availableLanguage": ["en", "zh"]
  },
  "sameAs": [
    "https://www.xinhong.site/",
    "https://www.qcc.com/firm/226dcd1da417ec32f940ea1a901ffb08.html",
    "https://aiqicha.baidu.com/company_detail_43850632131967"
  ]
}
</script>
